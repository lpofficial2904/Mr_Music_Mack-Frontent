# REFERENCE ONLY: merge with the existing VPS config; do not install unchanged.
# Replace __TLS_CERT__, __TLS_KEY__, __FRONTEND_DIST__ and __BACKEND_PORT__.
# Preserve existing ACME, admin subdomain, logging and firewall configuration.
server {
    listen 80;
    server_name mrmusicmack.com www.mrmusicmack.com;
    # Keep the current ACME challenge location if HTTP certificate renewal uses it.
    location / { return 308 https://mrmusicmack.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.mrmusicmack.com;
    ssl_certificate __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    # Keep browser API requests on their original host; do not redirect preflights.
    location ^~ /api/ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location / { return 301 https://mrmusicmack.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name mrmusicmack.com;
    ssl_certificate __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    root __FRONTEND_DIST__;
    include /etc/nginx/mime.types;
    client_max_body_size 16m;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        # This build directory contains content-hashed Vite assets only.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        # Node serves prerendered HTML, CMS metadata, alias redirects and real 404s.
        # Avoid `try_files $uri $uri/` here: nginx directory redirects conflict
        # with the site's no-trailing-slash canonical URLs.
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
